<main>
  <header class="brand-name">
    <h1>Laboratorio 2 · Productos y Categorías</h1>

    @if (authService.isLoggedIn()) {
      <nav class="menu">
        <a [routerLink]="['/products']">Productos</a>
        <a [routerLink]="['/categories']">Categorías</a>

        @if (authService.isAdmin()) {
          <a [routerLink]="['/users']">Usuarios</a>
        }

        <span class="session">
          {{ authService.username() }} ({{ authService.isAdmin() ? 'Administrador' : 'Usuario' }})
        </span>
        <button type="button" (click)="authService.logout()">Cerrar sesión</button>
      </nav>
    }
  </header>

  <section class="content">
    <router-outlet />
  </section>
</main>
