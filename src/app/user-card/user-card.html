<article class="card">
  <h3>{{ user().firstName }} {{ user().lastName }}</h3>
  <p class="username">&#64;{{ user().username }}</p>
  <p>{{ user().email }}</p>

  <div class="roles">
    @for (role of user().roles; track role) {
      <span class="badge" [class.admin]="role === 'SUPER-ADMIN-ROLE'">{{ role }}</span>
    } @empty {
      <span class="badge">Sin rol</span>
    }
  </div>
</article>
